name: Deploy to Hetzner

on:
  push:
    branches:
      - main
    paths:
      - 'java-springboot-backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        working-directory: java-springboot-backend
        run: ./gradlew clean bootJar --no-daemon -x test

      - name: Copy JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "java-springboot-backend/build/libs/api-1.0.0-SNAPSHOT.jar"
          target: "~/admina/"
          strip_components: 3

      - name: Rebuild and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/admina
            docker compose build --no-cache
            docker image prune -f
            systemctl restart admina
            sleep 30
            curl https://api.admina-app.com/actuator/health